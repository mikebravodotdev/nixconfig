<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Hack Nerd Font as the default monospace font for every app of this user.
     The Mono variant keeps icons inside one terminal cell; the regular one is the fallback. -->
<fontconfig>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Hack Nerd Font Mono</family>
      <family>Hack Nerd Font</family>
    </prefer>
  </alias>
</fontconfig>
