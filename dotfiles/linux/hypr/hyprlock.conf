# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Colors ($lock_*) come from the active theme, generated by theme-apply.
source = ~/.local/state/quickshell/theme/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = $lock_bg
}

input-field {
    monitor =
    size = 600, 80
    position = 0, 0
    halign = center
    valign = center
    outline_thickness = 2
    inner_color = $lock_card
    outer_color = $lock_accent
    font_color = $lock_fg
    check_color = $lock_check
    fail_color = $lock_fail
    fade_on_empty = false
    placeholder_text = Password
    rounding = 0
}
